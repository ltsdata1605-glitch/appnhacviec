    <style>
      html, body { background: #f2f2f7; margin: 0; }
      @media (prefers-color-scheme: dark) { html, body { background: #000; } }
      /* Màn chờ hiện ngay khi trang tải, trùng vị trí với ảnh khởi động của iPhone */
      #root > .launch { position: fixed; inset: 0; display: grid; place-items: center; background: #f2f2f7; }
      @media (prefers-color-scheme: dark) { #root > .launch { background: #000; } }
      #root > .launch .launch-icon { display: block; width: 88px; height: 88px; border-radius: 22.5%; overflow: hidden; }
